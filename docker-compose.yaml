version: '2.2'
services:
  web:
    image: netomoura10/localfiles
    ports:
      - "5001:80"
    networks:
    - elastic
    volumes:
      - ${HOME}/files:/files
  
  web2:
    image: netomoura10/filess3
    ports:
      - "5002:80"
    environment:
      AWS_ACCESS_KEY_ID: 
      AWS_SECRET_ACCESS_KEY: 
    networks:
    - elastic

